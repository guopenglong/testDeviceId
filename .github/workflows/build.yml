name: Build iOS App
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'
    - name: Build archive
      run: |
        xcodebuild -project testDeviceId.xcodeproj \
          -scheme testDeviceId \
          -sdk iphoneos \
          -configuration Release \
          -archivePath build/testDeviceId.xcarchive \
          archive \
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
    - name: Create unsigned IPA
      run: |
        mkdir Payload
        cp -R build/testDeviceId.xcarchive/Products/Applications/testDeviceId.app Payload/
        zip -r app.ipa Payload
    - name: Upload IPA
      uses: actions/upload-artifact@v3
      with:
        name: unsigned-ipa
        path: app.ipa
