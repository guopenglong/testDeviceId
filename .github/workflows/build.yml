name: Build DeviceIdChecker
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Build IPA
      run: |
        # 创建临时 App 结构
        mkdir -p Payload/DeviceIdChecker.app
        
        # 用 swiftc 直接编译
        xcrun swiftc \
          -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
          -target arm64-apple-ios16.0 \
          -O \
          -framework Foundation \
          -framework UIKit \
          -framework CryptoKit \
          Sources/DeviceIdChecker/main.swift \
          -o Payload/DeviceIdChecker.app/DeviceIdChecker
        
        # 创建 Info.plist
        cat > Payload/DeviceIdChecker.app/Info.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>DeviceIdChecker</string>
            <key>CFBundleIdentifier</key>
            <string>com.deviceid.checker</string>
            <key>CFBundleName</key>
            <string>DeviceIdChecker</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UILaunchStoryboardName</key>
            <string>LaunchScreen</string>
            <key>UISupportedInterfaceOrientations</key>
            <array>
                <string>UIInterfaceOrientationPortrait</string>
            </array>
        </dict>
        </plist>
        EOF
        
        # 创建启动界面 storyboard
        mkdir -p Payload/DeviceIdChecker.app/Base.lproj
        cat > Payload/DeviceIdChecker.app/Base.lproj/LaunchScreen.storyboard << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0" toolsVersion="13122.16" targetRuntime="AppleSDK" propertyAccessControl="none" useAutolayout="YES" launchScreen="YES" useTraitCollections="YES" useSafeAreas="YES" colorMatched="YES" initialViewController="01J-lp-oVM">
            <scenes>
                <scene sceneID="EHf-IW-A2E">
                    <objects>
                        <viewController id="01J-lp-oVM" sceneMemberID="viewController">
                            <view key="view" contentMode="scaleToFill" id="Ze5-6b-2t3">
                                <rect key="frame" x="0.0" y="0.0" width="375" height="667"/>
                                <autoresizingMask key="autoresizingMask" widthSizable="YES" heightSizable="YES"/>
                                <color key="backgroundColor" xcode11CocoaTouchSystemColor="systemBackgroundColor" cocoaTouchSystemColor="whiteColor"/>
                            </view>
                        </viewController>
                        <placeholder placeholderIdentifier="IBFirstResponder" id="iYj-Kq-Ea1" userLabel="First Responder" sceneMemberID="firstResponder"/>
                    </objects>
                    <point key="canvasLocation" x="53" y="375"/>
                </scene>
            </scenes>
        </document>
        EOF
        
        # 打包 IPA
        zip -r DeviceIdChecker.ipa Payload
        
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: DeviceIdChecker-IPA
        path: DeviceIdChecker.ipa
